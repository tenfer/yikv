apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: patch-never-pull.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: yikv-server-config
    behavior: replace
    files:
      - config.json=server-config.json

images:
  - name: yikv-server
    newName: yikv-server
    newTag: latest
