schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
Context: |
  Tech stack: C++, Python
  Domain: kv storage
  Conventions:
    - 使用中文进行交流和编写文档
    - 所有的运行结果必须输出报告，统一放到reports目录，报告格式为markdown，报告内容为运行结果的详细描述，包括运行时间，运行环境，运行结果，运行日志，运行错误等。
    - 设计方案为稳定性强，性能高，易用性好的kv存储系统，并提供完整的测试覆盖
    - 代码结构清晰，易于维护，易于扩展
    - 使用C++实现，使用Python实现工具链
    - 使用FlatBuffers作为序列化格式
    - 使用librdkafka作为Kafka客户端
    - 使用MinIO作为对象存储，使用S3兼容的API
    - 使用Docker作为容器化，使用Dockerfile定义容器镜像
    - 使用Kubernetes作为部署，使用Kubernetes的YAML文件定义部署

rules:
  proposal:
    - 正文主体使用简体中文；专有名词（Bazel、OpenSpec、E2E）、路径、二进制名、YAML 字段名及规范用语 MUST/SHALL 可按需保留英文。
    - 章节可与模板一致（## Why → 可写「## 缘由」或直接保留双语标题但以中文阐述为主）。
  design:
    - 正文主体使用简体中文；表格、术语与上文约定一致。
  specs:
    - 每条 Requirement 的描述以中文撰写，且为满足校验每条须显式包含英文规范词 MUST 或 SHALL。
    - 场景小节标题可使用中文；WHEN/THEN 清单内以中文叙述为主。
  tasks:
    - 任务描述使用简体中文；命令与路径保持与仓库一致。
